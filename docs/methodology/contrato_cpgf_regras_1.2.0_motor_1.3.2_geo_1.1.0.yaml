sensitivity_contract:
  required_fields:
  - TRILHA
  - PARAMETRO
  - VALOR_CENARIO
  - METRICA
  - UNIDADE_CONTAGEM
  - VALOR_METRICA
  - N_SINAIS_TOTAL_CENARIO
  - N_SINAIS_BASELINE
  - COMPARAVEL_COM_BASELINE
  - TIPO_CONTROLE
  - BASELINE
  - OBSERVACAO
  control_types:
    locked:
    - T01 weekend definition
    - T02 transaction code
    - T08 Benford formulas
    - T09 legal limits
    experimental:
    - T03 min occurrences
    - T04 min cardholders
    - T05 analytical parameters
    - T06 Top-1 thresholds
    - T07 days/percentile
    - T09 proximity band
  special_semantics:
    T05: 160-grid is calibration of representative groups and is not directly comparable to final episodes; production
      simulator must rerun full episode/dedup logic.
    T08: N represents population size and MAD/classification, not number of T08 signals.
    T09: Adjustable proximity changes only the proximity subset; scenario total includes proximity + no-limit + above-limit
      fixed cases.
  baseline_t09:
    near: 22954
    fixed_at_or_above: 23987
    total: 46941
validation_protocol:
  statuses:
  - NAO_VALIDADO
  - EM_ANALISE
  - CONFIRMADO
  - JUSTIFICADO
  - FALSO_POSITIVO
  - ERRO_DADO
  - INCONCLUSIVO
  automatic_confirmed: false
  stratification: TRILHA x NIVEL_TRIAGEM
  target_per_trail: 30
  baseline_sample_n: 236
  sampling: deterministic hash within stratum; redistribute unused quota across strata of the same trail
  weight_formula: PESO_AMOSTRAL = N_POP_ESTRATO / N_AMOSTRA_ESTRATO
  initial_reporting: Prefer results by trail and triage level. Global motor accuracy requires explicit weighting/design.
  recalibration_rules:
    CONFIRMADO: Preserve evidence and monitor stability.
    JUSTIFICADO: Assess whether legitimate exception should enter eligibility.
    FALSO_POSITIVO: Re-examine one parameter at a time and remeasure volume/overlap/marginality.
    ERRO_DADO: Fix data layer; do not recalibrate rule because of source error.
    INCONCLUSIVO: Review minimum evidence package before altering parameters.
dashboard_contract:
  tabs:
  - Visão geral
  - Motor de Trilhas
  - Diagnóstico do Motor
  - Sinais e Validação
  - Metodologia
  - Assistente IA
  explainability: Show evidence type, family, parameters, exposure stratum, limitations and source transactions.
  ai_may:
  - explain structured evidence
  - explain parameters
  - retrieve normative foundation
  - compare periods/entities
  - state limitations/abstain
  ai_must_not:
  - declare fraud automatically
  - declare fragmentation without object/documentation
  - change legal limits
  - treat correlation as causality
  - hide rule version
change_control:
  rules_semver:
    PATCH: implementation fix without rule semantic change
    MINOR: parameter/population/classification/rule change affecting signals or explanation
    MAJOR: change in analytical architecture or central methodological/legal construct
  motor_semver:
    PATCH: governance/interface contract fix without changing T01-T09 semantics
    MINOR: change in governance method that materially changes interpretation/diagnostic output
    MAJOR: change in governance architecture or validation construct
  frozen_change_requirement: Update contract + tests + calibration evidence + specification + version in the same
    change set.
