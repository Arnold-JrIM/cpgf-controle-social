trails:
  T01:
    name: Despesa realizada em final de semana
    role: Núcleo — transação; recorrência contextual
    primary_unit: Transação; contexto UG × portador × ano
    frozen_rule: Sinalizar compra efetiva em sábado ou domingo pela DATA TRANSAÇÃO. A recorrência anual por UG × portador
      é contexto descritivo e não cria nova trilha.
    parameters: Sábado/domingo. Sem limiar de recorrência congelado para novo alerta.
    triage: ATENCAO no sinal individual.
    normative_foundation: 'Guias e manuais de suprimento de fundos: necessidade de examinar justificativa de despesas
      realizadas em final de semana.'
    scientific_methodological_foundation: Fundamento científico predominantemente arquitetural em auditoria contínua;
      a condição material é normativa.
    central_limitation: A justificativa documental não está na base pública.
    baseline: 49.675 sinais.
    rules_version: 1.2.0
  T02:
    name: Transação classificada como compra parcelada
    role: Núcleo — transação
    primary_unit: Transação
    frozen_rule: TRANSAÇÃO = 'CPP LOJISTA TRF P/FATURA - REAL', por correspondência exata.
    parameters: Código operacional bloqueado.
    triage: ATENCAO.
    normative_foundation: 'Guias/manuais de suprimento: conferência de pagamentos à vista, totais e em uma única parcela.'
    scientific_methodological_foundation: Fundamento científico predominantemente arquitetural em auditoria contínua;
      a condição material é normativa.
    central_limitation: O código operacional isolado não demonstra descumprimento.
    baseline: 14 sinais.
    rules_version: 1.2.0
  T03:
    name: Repetição exata de transações
    role: Núcleo — grupo; T03-B apenas diagnóstico
    primary_unit: Grupo de transações; ponte até linhas originais
    frozen_rule: 'T03-A: UG + portador + favorecido + data + valor em centavos + tipo de transação. T03-B: repetição
      integral apenas em registros observáveis; não entra na convergência.'
    parameters: N≥2; REFORCADO quando N≥3. Comparações monetárias em centavos inteiros.
    triage: ATENCAO para N=2; REFORCADO para N≥3.
    normative_foundation: Monitoramento do uso do suprimento; sem presunção normativa de duplicidade.
    scientific_methodological_foundation: Auditoria analítica e drill-down de duplicações; interpretação condicionada
      ao contexto.
    central_limitation: Transações legítimas podem compartilhar atributos idênticos. Não chamar automaticamente de
      pagamento duplicado.
    baseline: '7.534 grupos T03-A; T03-B: 7.523 grupos integralmente observáveis.'
    rules_version: 1.2.0
  T04:
    name: Repetição multiportador
    role: Núcleo — fornecedor
    primary_unit: UG × fornecedor × data × valor
    frozen_rule: Agrupar UG + fornecedor + data + valor e sinalizar quando houver pelo menos 2 portadores distintos.
    parameters: ATENCAO=2 portadores; REFORCADO=3–4; MUITO_ELEVADO≥5.
    triage: Faixas analíticas por número de portadores; não representam gradação jurídica.
    normative_foundation: Monitoramento conjunto dos supridos da mesma UG para padrões de aquisições.
    scientific_methodological_foundation: Análise relacional de padrões de compras; evidência não conclusiva.
    central_limitation: O objeto adquirido não é observável.
    baseline: 1.384 grupos.
    rules_version: 1.2.0
  T05:
    name: Recorrência de aquisições
    role: Núcleo — fornecedor
    primary_unit: Episódio UG × fornecedor × ano
    frozen_rule: Janela de 30 dias, ≥5 transações, ≥2 portadores e CV≤20%; janelas sobrepostas são deduplicadas mantendo
      o episódio mais forte.
    parameters: 'Baseline: 30 dias; N≥5; portadores≥2; CV≤0,20. REFORCADO quando CV≤0,10. Similaridade robusta em
      ±20% da mediana como atributo.'
    triage: ATENCAO / REFORCADO.
    normative_foundation: Monitoramento de aquisições recorrentes e possível fracionamento no âmbito da UG.
    scientific_methodological_foundation: Detecção de padrões e auditoria analítica; parâmetros calibrados empiricamente.
    central_limitation: Sem objeto da despesa, não é possível confirmar fracionamento.
    baseline: 1.693 episódios finais.
    rules_version: 1.2.0
  T06:
    name: Concentração em fornecedor
    role: Núcleo — estrutura do fornecedor/UG
    primary_unit: UG × ano; fornecedor principal
    frozen_rule: Elegível com ≥20 compras identificadas, ≥3 fornecedores e cobertura de valor identificado ≥80%; sinal
      quando Top-1 por valor ≥50%.
    parameters: ATENCAO 50–<70%; REFORCADO 70–<80%; MUITO_ELEVADO ≥80%. Calcular Top-1 por valor/quantidade, Top-5
      e HHI.
    triage: ATENCAO / REFORCADO / MUITO_ELEVADO.
    normative_foundation: Boas práticas de razoabilidade e exame da estrutura de fornecedores.
    scientific_methodological_foundation: Métricas de concentração, inclusive Top-1 e HHI, utilizadas como indicadores
      estruturais.
    central_limitation: Concentração não equivale a favorecimento ou direcionamento.
    baseline: 233 UG-anos.
    rules_version: 1.2.0
  T07:
    name: Recorrência de múltiplos saques
    role: Núcleo — portador/UG; episódio diário como diagnóstico
    primary_unit: 'T07-A: UG × portador × dia; T07-B: UG × portador × ano'
    frozen_rule: T07-A identifica ≥2 saques no mesmo dia. T07-B prioriza portadores com ≥3 dias de múltiplos saques
      e N_DIAS_MULTISAQUE ≥ P90 do ano, desde que existam ≥10 comparáveis.
    parameters: ≥3 dias; quantil anual 90%; mínimo 10 comparáveis.
    triage: T07-B é a saída prioritária da tabela-mestre.
    normative_foundation: Saques devem estar relacionados às ações autorizadas no ato de concessão.
    scientific_methodological_foundation: Monitoramento longitudinal de comportamento e priorização relativa.
    central_limitation: A base pública não contém a autorização do saque.
    baseline: 22.609 episódios diários diagnósticos; 1.089 portador-anos prioritários.
    rules_version: 1.2.0
  T08:
    name: Lei de Newcomb-Benford
    role: Contexto estatístico — não aumenta convergência núcleo
    primary_unit: População; ano; UG × ano; valor/dígito; persistência
    frozen_rule: Elegibilidade → D1 → D12 → MAD → Z/χ² auxiliares → Summation → Number Duplication → drill-down →
      ranking relativo UG-ano → persistência relativa.
    parameters: 'D12≥R$10; N<300 não aplicar; 300–999 exploratório; ≥1000 formal; ≥3000 maior robustez. Ranking relativo:
      2013–2025, ≥10 UGs comparáveis, extremo ≥P90 do MAD D12.'
    triage: Contexto; 12 extremos relativos na baseline.
    normative_foundation: Não é regra jurídica; funciona como técnica analítica auxiliar.
    scientific_methodological_foundation: Nigrini (2012) e literatura de Benford aplicada à auditoria.
    central_limitation: Não conformidade não prova erro ou fraude; arredondamento e pontos de preço afetam a distribuição.
    baseline: MAD D1=0,006939; MAD D12=0,002583; 12 extremos UG-ano; 3 UGs com persistência elevada.
    rules_version: 1.2.0
  T09:
    name: Referências financeiras aplicáveis
    role: Contexto normativo-financeiro — não aumenta convergência núcleo
    primary_unit: Transação; agregado descritivo UG × fornecedor × ano
    frozen_rule: 'Aplicar dimensão normativa pela data e comparar em centavos inteiros em dois cenários: compras/serviços
      e obras/engenharia. Status por cenário: ABAIXO_FAIXA, PROXIMO_LIMITE, NO_LIMITE e ACIMA_LIMITE.'
    parameters: Faixa de proximidade baseline=90%; limites normativos bloqueados; categoria real não escolhida automaticamente.
    triage: INFORMATIVO para próximo/no limite; ATENCAO acima de pelo menos um cenário; REFORCADO acima de ambos.
    normative_foundation: Portaria MF 95/2002 e Portaria Normativa MF 1.344/2023, conforme vigência, com valores legais
      atualizados.
    scientific_methodological_foundation: Uso de benchmarks normativos como contexto de triagem; não substitui enquadramento
      jurídico.
    central_limitation: Objeto/categoria e ato de concessão não estão disponíveis; não declarar fracionamento.
    baseline: 46.941 sinais/contextos.
    rules_version: 1.2.0
