principles:
- Sinal analítico não equivale a fraude, irregularidade ou fracionamento.
- DATA_TRANSACAO é a referência temporal comportamental/normativa; competência do extrato é metadado de origem.
- Comparações monetárias exatas usam centavos inteiros.
- Cada sinal deve ser rastreável às transações que o originaram.
- NIVEL_TRIAGEM é intra-trilha e não forma escala única de risco.
- T08 e T09 são contextos e não aumentam a contagem de convergência núcleo.
- Natureza da evidência é separada do status de validação.
- Não existe score opaco obrigatório.
- Parâmetros legais e definições determinísticas permanecem bloqueados.
- Redundância estatística não exclui regra automaticamente.
- Assertividade somente pode ser estimada após validação humana.
