name: joint-retrieval-holdout-v2-measurement

# A primeira medição independente válida já foi executada no run 31967548985.
# Depois que o manifesto muda para MEASURED_INDEPENDENT, este workflow deixa de
# ser disparado por pull_request para impedir que commits documentais tentem
# produzir uma nova "primeira medição". Mantê-lo em workflow_dispatch preserva
# o procedimento histórico, enquanto o manifesto estático preserva o resultado.
on:
  workflow_dispatch:

jobs:
  first-measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Revalidate freeze without measuring
        run: |
          python scripts/preflight_joint_retrieval_holdout_v2.py \
            --output joint_retrieval_holdout_v2_preflight_before_measurement.json
      - name: Measure frozen Router and Planner
        run: |
          python scripts/measure_joint_retrieval_holdout_v2.py \
            --output joint_retrieval_holdout_v2_measurement.json
      - name: Validate measurement contract without performance threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("joint_retrieval_holdout_v2_measurement.json").read_text(encoding="utf-8")
          )
          assert payload["status"] == "FIRST_VALID_MEASUREMENT_CANDIDATE"
          assert payload["benchmark_sha256"] == (
              "47d29dfaa0e71ea4b9c7c813b02d1001fa32a7605a241f95708686718a5b7ec7"
          )
          assert payload["summary"]["cases"] == 40
          assert payload["primary_metric"] == "route + scope + temporal exact match"
          governance = payload["governance"]
          assert governance["oracle_used_only_for_post_hoc_comparison"] is True
          assert governance["retriever_called"] is False
          assert governance["llm_called"] is False
          assert governance["sql_executed"] is False
          assert governance["external_embeddings_called"] is False
          assert governance["no_operational_rules_modified_for_measurement"] is True
          PY
      - name: Upload first measurement evidence
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-holdout-v2-first-measurement-py3.11
          path: |
            joint_retrieval_holdout_v2_preflight_before_measurement.json
            joint_retrieval_holdout_v2_measurement.json
          if-no-files-found: error

  reproduce-python-3-12:
    needs: first-measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Reproduce frozen measurement
        run: |
          python scripts/measure_joint_retrieval_holdout_v2.py \
            --output joint_retrieval_holdout_v2_measurement_py3.12.json
      - name: Validate reproduction contract without performance threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("joint_retrieval_holdout_v2_measurement_py3.12.json").read_text(encoding="utf-8")
          )
          assert payload["status"] == "FIRST_VALID_MEASUREMENT_CANDIDATE"
          assert payload["benchmark_sha256"] == (
              "47d29dfaa0e71ea4b9c7c813b02d1001fa32a7605a241f95708686718a5b7ec7"
          )
          assert payload["summary"]["cases"] == 40
          assert payload["governance"]["llm_called"] is False
          assert payload["governance"]["sql_executed"] is False
          PY
      - name: Upload Python 3.12 reproduction
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-holdout-v2-reproduction-py3.12
          path: joint_retrieval_holdout_v2_measurement_py3.12.json
          if-no-files-found: error
