name: joint-retrieval-flow-attribution-v3

on:
  pull_request:
    paths:
      - "data/manifests/joint_retrieval_flow_attribution_v3_1_0_0.json"
      - "tests/unit/test_joint_retrieval_flow_attribution_v3.py"
      - "tests/unit/test_versions.py"
      - ".github/workflows/joint_retrieval_flow_attribution_v3.yml"
  workflow_dispatch:

jobs:
  historical-evidence:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate frozen JH3 post-hoc evidence
        run: pytest -q tests/unit/test_joint_retrieval_flow_attribution_v3.py
      - name: Validate historical JH3 diagnostic contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("data/manifests/joint_retrieval_flow_attribution_v3_1_0_0.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["status"] == "POST_HOC_DIAGNOSTIC_FROZEN"
          assert manifest["frozen_flow"]["router_version"] == "1.3.0"
          assert manifest["frozen_flow"]["retrieval_planner_version"] == "1.2.0"
          result = manifest["results"]
          assert result["actual_joint_exact"] == 27
          assert result["router_only_failures"] == 12
          assert result["planner_only_failures"] == 4
          assert result["shared_router_planner_failures"] == 5
          assert result["best_case_joint_exact_with_expected_route_correction_only"] == 39
          assert manifest["governance"]["tuning_performed_in_increment"] is False
          PY
