name: router-v1.2-regression

on:
  pull_request:
    paths:
      - "src/cpgf/ai/router.py"
      - "scripts/evaluate_router_v1_2_regression.py"
      - "tests/unit/test_assistant_router_v1_2.py"
      - "data/benchmarks/assistant_v1_0_0.csv"
      - "data/benchmarks/assistant_router_holdout_v1_0_0.csv"
      - "data/benchmarks/assistant_router_holdout_v2_0_0.csv"
      - "data/manifests/assistant_router_1_2_0.json"
      - ".github/workflows/router_v1_2_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Evaluate known Router regression sets
        run: |
          python scripts/evaluate_router_v1_2_regression.py \
            --output router_v1_2_regression.json
      - name: Run full pytest diagnostics
        id: pytest_diagnostics
        continue-on-error: true
        run: pytest -q --junitxml=pytest-results.xml
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-v1.2-historical-regression-py${{ matrix.python-version }}
          path: |
            router_v1_2_regression.json
            pytest-results.xml
          if-no-files-found: error
      - name: Enforce legacy Router regression gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("router_v1_2_regression.json").read_text(encoding="utf-8"))
          routing = payload["routing_sets"]
          expected = {"development": 50, "router_holdout_v1": 40, "router_holdout_v2": 40}
          for key, cases in expected.items():
              summary = routing[key]["summary"]
              assert summary["cases"] == cases, (key, summary)
              assert summary["accuracy_all"] == 1.0, (key, summary, routing[key]["errors"])

          historical = payload["historical_retrieval_flow"]
          assert historical["router_version"] == "1.2.0", historical
          assert historical["planner_version_held_fixed"] == "1.0.0", historical
          assert historical["cases"] == 30, historical
          assert historical["joint_exact"] == 21, historical
          assert historical["joint_filter_failures"] == 9, historical
          assert historical["router_contribution_to_joint_failures"] == 0, historical
          assert historical["planner_contribution_to_joint_failures"] == 9, historical
          assert historical["latent_router_issues_with_exact_filters"] == 0, historical
          assert historical["attribution_counts"] == {"pass": 21, "planner": 9}, historical
          assert historical["frozen_historical_evidence"] is True, historical
          PY
      - name: Enforce full pytest
        if: steps.pytest_diagnostics.outcome != 'success'
        run: exit 1
