name: evidence-contracts-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/evidence_contracts.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_evidence_contracts.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/evidence_contracts_1_0_0.md"
      - ".github/workflows/evidence_contracts_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/evidence_contracts.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_evidence_contracts.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/evidence_contracts_1_0_0.md"
      - ".github/workflows/evidence_contracts_v1.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint evidence contract boundary
        run: ruff check src/cpgf/ai/evidence_contracts.py tests/unit/test_evidence_contracts.py
      - name: Validate evidence contracts
        run: pytest -q tests/unit/test_evidence_contracts.py tests/unit/test_versions.py
      - name: Enforce architecture 2.0 contract boundary
        run: |
          python - <<'PY'
          from cpgf.ai.evidence_contracts import EvidenceSource
          from cpgf.version import EVIDENCE_CONTRACT_VERSION

          assert EVIDENCE_CONTRACT_VERSION == "1.0.0"
          assert {source.value for source in EvidenceSource} == {"data", "knowledge", "web"}
          PY
