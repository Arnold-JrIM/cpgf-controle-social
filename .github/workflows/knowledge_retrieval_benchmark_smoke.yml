name: knowledge-retrieval-benchmark-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/knowledge-retrieval-benchmark-v1.0.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Validate frozen retrieval benchmark
        run: python scripts/validate_knowledge_retrieval_benchmark.py
