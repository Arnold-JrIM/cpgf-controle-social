name: retrieval-planner-v1.3-regression

on:
  pull_request:
    paths:
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/ai/router.py"
      - "src/cpgf/version.py"
      - "scripts/evaluate_retrieval_planner_v1_3_regression.py"
      - "tests/unit/test_retrieval_planner_v1_3.py"
      - "tests/unit/test_versions.py"
      - "data/benchmarks/knowledge_retrieval_v1_0_0.csv"
      - "data/benchmarks/retrieval_planner_holdout_v1_0_0.csv"
      - "data/benchmarks/joint_retrieval_holdout_v2_0_0.csv"
      - "data/benchmarks/joint_retrieval_holdout_v3_0_0.csv"
      - "data/manifests/assistant_router_1_4_0.json"
      - ".github/workflows/retrieval_planner_v1_3_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Evaluate Planner 1.3 known regressions
        run: |
          python scripts/evaluate_retrieval_planner_v1_3_regression.py \
            --output retrieval_planner_v1_3_regression.json
      - name: Run Planner 1.3 unit gate
        run: |
          pytest -q \
            tests/unit/test_retrieval_planner_v1_3.py \
            tests/unit/test_versions.py
      - name: Upload Planner 1.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-planner-v1.3-known-regression-py${{ matrix.python-version }}
          path: retrieval_planner_v1_3_regression.json
          if-no-files-found: error
      - name: Enforce Planner 1.3 regression contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("retrieval_planner_v1_3_regression.json").read_text())
          assert p["status"] == "KNOWN_REGRESSION_ONLY"
          assert p["router_version_held_fixed"] == "1.4.0"
          assert p["router_source_git_blob_sha"] == "89150b97e9c87d9af0d0b0f888870dcc74ef86b1"
          assert p["planner_version"] == "1.3.0"

          for key in ("development", "known_holdout"):
              r = p[key]["result"]
              assert r["cases"] == 30, r
              assert r["scope_exact_match_rate"] == 1.0, p[key]["joint_divergent_ids"]
              assert r["temporal_exact_match_rate"] == 1.0, p[key]["joint_divergent_ids"]
              assert r["joint_exact_match_rate"] == 1.0, p[key]["joint_divergent_ids"]

          jh2 = p["joint_holdout_v2_known_regression"]
          assert jh2["cases"] == 40
          assert jh2["route_exact"] == 40
          assert jh2["scope_exact"] == 40
          assert jh2["temporal_exact"] == 40
          assert jh2["joint_exact"] == 40, jh2["joint_error_ids"]

          baseline = p["baseline_before_planner_1_3"]
          assert baseline["route_exact"] == 48
          assert baseline["scope_exact"] == 41
          assert baseline["temporal_exact"] == 41
          assert baseline["joint_exact"] == 39
          assert len(baseline["remaining_joint_error_ids"]) == 9

          jh3 = p["joint_holdout_v3_known_regression"]
          assert jh3["cases"] == 48
          assert jh3["route_exact"] == 48, jh3["route_error_ids"]
          assert jh3["scope_exact"] == 48, jh3["scope_error_ids"]
          assert jh3["temporal_exact"] == 48, jh3["temporal_error_ids"]
          assert jh3["joint_exact"] == 48, jh3["joint_error_ids"]

          g = p["governance"]
          assert g["router_modified_in_increment"] is False
          assert g["router_blob_preserved"] is True
          assert g["case_id_specific_rules_added"] is False
          assert g["new_generalization_claim"] is False
          assert g["llm_called"] is False
          assert g["retriever_called"] is False
          PY
