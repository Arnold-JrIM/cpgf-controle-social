name: orchestration-holdout-v1-preflight

on:
  pull_request:
    paths:
      - "data/benchmarks/orchestration_holdout_v1_0_0.csv.gz"
      - "data/manifests/orchestration_holdout_1_0_0.json"
      - "src/cpgf/benchmark/orchestration_holdout_v1.py"
      - "scripts/preflight_orchestration_holdout_v1.py"
      - "tests/unit/test_orchestration_holdout_v1.py"
      - "src/cpgf/ai/semantic_orchestrator.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/evidence_contracts.py"
      - "src/cpgf/ai/evidence_workers.py"
      - "src/cpgf/ai/tools/registry.py"
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/version.py"
      - "data/benchmarks/*.csv"
      - ".github/workflows/orchestration_holdout_v1_preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint prospective holdout boundary
        run: >-
          ruff check
          src/cpgf/benchmark/orchestration_holdout_v1.py
          scripts/preflight_orchestration_holdout_v1.py
          tests/unit/test_orchestration_holdout_v1.py
      - name: Validate prospective freeze without model execution
        run: |
          python scripts/preflight_orchestration_holdout_v1.py \
            --output orchestration_holdout_v1_preflight.json
      - name: Run freeze unit gates
        run: >-
          pytest -q
          tests/unit/test_orchestration_holdout_v1.py
          tests/unit/test_versions.py
      - name: Enforce pre-measurement independence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("orchestration_holdout_v1_preflight.json").read_text())
          assert p["status"] == "PASS"
          assert p["manifest_status"] == "FROZEN_BEFORE_MEASUREMENT"
          assert p["benchmark_sha256"] == "9ef3d9ac59dc16eb6762f2ae2fd7672a2305c4854614f1e5a71ef893e5d525ef"
          c = p["capability_validation"]
          assert c["cases"] == 56
          assert c["category_counts"] == {
              "all_three": 8,
              "data_knowledge": 8,
              "data_only": 8,
              "data_web": 8,
              "knowledge_only": 8,
              "knowledge_web": 8,
              "web_only": 8,
          }
          assert c["source_presence_counts"] == {"data": 32, "knowledge": 32, "web": 32}
          assert c["web_official_only_cases"] == 32
          assert c["web_explicit_freshness_window_cases"] == 32

          n = p["novelty_validation"]
          assert n["prior_benchmarks_compared"] == 9
          assert n["prior_questions_compared"] == 374
          assert n["normalized_exact_overlap"] == 0
          assert n["highest_sequence_similarity"] <= 0.70

          assert p["current_candidate"]["matches_frozen_candidate"] is True
          assert p["current_candidate"]["model"] == "gpt-4o-mini"

          gate = p["prospective_acceptance_gate"]
          assert gate["minimum_mean_evidence_source_set_exact_rate"] == 0.65
          assert gate["minimum_mean_source_precision"] == 0.80
          assert gate["minimum_mean_source_recall"] == 0.80
          assert gate["minimum_data_tool_exact_rate"] == 0.70
          assert gate["minimum_data_arguments_exact_rate"] == 0.60
          assert gate["minimum_knowledge_filters_joint_exact_rate"] == 0.50
          assert gate["minimum_web_parameters_exact_rate"] == 0.70
          assert gate["minimum_mean_modal_stability"] == 0.90
          assert gate["minimum_each_category_source_set_exact_rate"] == 0.50

          g = p["governance"]
          assert g["llm_called"] is False
          assert g["plan_evidence_called"] is False
          assert g["workers_called"] is False
          assert g["retriever_called"] is False
          assert g["web_called"] is False
          assert g["sql_executed"] is False
          assert g["measurement_performed"] is False
          assert g["candidate_outputs_used_during_authoring"] is False
          PY
      - name: Upload prospective preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-holdout-v1-preflight-py${{ matrix.python-version }}
          path: orchestration_holdout_v1_preflight.json
          if-no-files-found: error
