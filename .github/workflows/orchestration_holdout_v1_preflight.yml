name: orchestration-holdout-v1-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Snapshot histórico da primeira medição independente do OH1.
          # O OH1 é conhecido desde esse run e não deve bloquear candidatas posteriores.
          ref: ec87579fe285ddaf29b64bd05e3055ec3cb95736
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint historical prospective holdout boundary
        run: >-
          ruff check
          src/cpgf/benchmark/orchestration_holdout_v1.py
          scripts/preflight_orchestration_holdout_v1.py
          tests/unit/test_orchestration_holdout_v1.py
      - name: Revalidate historical prospective freeze without model execution
        run: |
          python scripts/preflight_orchestration_holdout_v1.py \
            --output orchestration_holdout_v1_preflight.json
      - name: Run historical freeze unit gates
        run: >-
          pytest -q
          tests/unit/test_orchestration_holdout_v1.py
          tests/unit/test_versions.py
      - name: Enforce historical pre-measurement record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("orchestration_holdout_v1_preflight.json").read_text())
          assert p["status"] == "PASS"
          assert p["manifest_status"] == "FROZEN_BEFORE_MEASUREMENT"
          assert p["benchmark_sha256"] == "9ef3d9ac59dc16eb6762f2ae2fd7672a2305c4854614f1e5a71ef893e5d525ef"
          assert p["current_candidate"]["matches_frozen_candidate"] is True
          assert p["current_candidate"]["model"] == "gpt-4o-mini"
          assert p["governance"]["llm_called"] is False
          assert p["governance"]["measurement_performed"] is False
          PY
      - name: Upload historical preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-holdout-v1-historical-preflight-py${{ matrix.python-version }}
          path: orchestration_holdout_v1_preflight.json
          if-no-files-found: error
