name: joint-retrieval-holdout-v4-candidate-preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Reproduce historical candidate preflight without Router or Planner execution
        run: |
          python scripts/preflight_joint_retrieval_holdout_v4_candidate.py \
            --output joint_retrieval_holdout_v4_candidate_preflight.json
      - name: Enforce candidate-only governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(
              Path("joint_retrieval_holdout_v4_candidate_preflight.json").read_text()
          )
          assert p["status"] == "PASS"
          assert p["benchmark_sha256"] == "a90867717d73407b586cee02ec2eeb8c075db2f86c345bb9985193e0ca31700a"
          assert p["catalog_validation"]["cases"] == 48
          assert p["novelty_validation"]["prior_questions_compared"] == 278
          assert p["novelty_validation"]["normalized_exact_overlap"] == 0
          assert p["novelty_validation"]["highest_sequence_similarity"] <= 0.75
          g = p["governance"]
          assert g["candidate_only"] is True
          assert g["router_called"] is False
          assert g["retrieval_planner_called"] is False
          assert g["retriever_called"] is False
          assert g["llm_called"] is False
          assert g["measurement_performed"] is False
          PY
      - name: Upload candidate preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-holdout-v4-candidate-preflight-py${{ matrix.python-version }}
          path: joint_retrieval_holdout_v4_candidate_preflight.json
          if-no-files-found: error
