name: orchestration-holdout-v1-measurement

on:
  pull_request:
    paths:
      - "data/manifests/orchestration_holdout_measurement_1_0_0.json"
      - "data/manifests/orchestration_holdout_first_measurement_1_0_0.json"
      - "data/evidence/orchestration_holdout_v1_first_measurement_1_0_0.json.gz.b64.*"
      - "src/cpgf/benchmark/orchestration_holdout_measurement_v1.py"
      - "scripts/run_orchestration_holdout_v1.py"
      - "tests/unit/test_orchestration_holdout_measurement_v1.py"
      - "tests/unit/test_orchestration_holdout_first_measurement.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestration_holdout_measurement_1_0_0.md"
      - "docs/architecture/orchestration_holdout_first_measurement_1_0_0.md"
      - ".github/workflows/orchestration_holdout_v1_measurement.yml"

concurrency:
  group: orchestration-holdout-v1-first-independent-measurement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint frozen OH1 measurement evidence
        run: >-
          ruff check
          src/cpgf/benchmark/orchestration_holdout_measurement_v1.py
          scripts/run_orchestration_holdout_v1.py
          tests/unit/test_orchestration_holdout_measurement_v1.py
          tests/unit/test_orchestration_holdout_first_measurement.py
      - name: Validate historical harness and frozen first result offline
        run: |
          pytest -q \
            tests/unit/test_orchestration_holdout_measurement_v1.py \
            tests/unit/test_orchestration_holdout_first_measurement.py \
            tests/unit/test_orchestration_holdout_v1.py \
            tests/unit/test_semantic_orchestrator.py \
            tests/unit/test_model_policy.py \
            tests/unit/test_versions.py
      - name: Enforce post-measurement governance without a new LLM run
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path("data/manifests/orchestration_holdout_measurement_1_0_0.json")
              .read_text(encoding="utf-8")
          )
          result = json.loads(
              Path("data/manifests/orchestration_holdout_first_measurement_1_0_0.json")
              .read_text(encoding="utf-8")
          )

          assert protocol["status"] == "MEASUREMENT_HARNESS_FROZEN_BEFORE_FIRST_OH1_LLM_RUN"
          assert protocol["measurement"]["performed"] is False
          assert protocol["execution"]["model"] == "gpt-4o-mini"
          assert protocol["execution"]["llm_repetitions"] == 3
          assert protocol["execution"]["expected_llm_calls"] == 168

          assert result["status"] == "MEASURED_INDEPENDENT_GATE_FAIL"
          assert result["prospective_gate"]["passed"] is False
          assert result["governance"]["gate_not_relaxed_post_hoc"] is True
          assert result["governance"]["result_frozen_before_post_hoc_tuning"] is True
          assert result["governance"]["reruns_are_not_new_independent_measurements"] is True
          assert result["governance"]["production_activation"] is False

          workflow_lines = Path(
              ".github/workflows/orchestration_holdout_v1_measurement.yml"
          ).read_text(encoding="utf-8").splitlines()
          assert not any(line == "  push:" for line in workflow_lines)
          assert not any(line.startswith("      OPENAI_API_KEY:") for line in workflow_lines)
          assert not any(line == "  live-measurement:" for line in workflow_lines)
          PY
