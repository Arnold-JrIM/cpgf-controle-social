name: orchestrator-normalization-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/orchestrator_normalization.py"
      - "src/cpgf/ai/semantic_orchestrator.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_orchestrator_normalization.py"
      - "tests/unit/test_semantic_orchestrator_normalization.py"
      - "tests/unit/test_semantic_orchestrator.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestrator_normalization_1_0_0.md"
      - ".github/workflows/orchestrator_normalization_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/orchestrator_normalization.py"
      - "src/cpgf/ai/semantic_orchestrator.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_orchestrator_normalization.py"
      - "tests/unit/test_semantic_orchestrator_normalization.py"
      - "tests/unit/test_semantic_orchestrator.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestrator_normalization_1_0_0.md"
      - ".github/workflows/orchestrator_normalization_v1.yml"

permissions:
  contents: read

jobs:
  normalization:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint normalization boundary
        run: >-
          ruff check
          src/cpgf/ai/orchestrator_normalization.py
          src/cpgf/ai/semantic_orchestrator.py
          tests/unit/test_orchestrator_normalization.py
          tests/unit/test_semantic_orchestrator_normalization.py
          tests/unit/test_semantic_orchestrator.py
          tests/unit/test_versions.py
      - name: Test deterministic normalization
        run: >-
          pytest -q
          tests/unit/test_orchestrator_normalization.py
          tests/unit/test_semantic_orchestrator_normalization.py
          tests/unit/test_semantic_orchestrator.py
          tests/unit/test_versions.py
      - name: Enforce deterministic low-privilege boundary
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          from cpgf.ai.model_policy import DEFAULT_LLM_MODEL
          from cpgf.ai.orchestrator_normalization import ORCHESTRATOR_NORMALIZATION_VERSION
          from cpgf.ai.semantic_orchestrator import ORCHESTRATOR_SYSTEM_PROMPT

          source = Path("src/cpgf/ai/orchestrator_normalization.py").read_text(encoding="utf-8")
          assert ORCHESTRATOR_NORMALIZATION_VERSION == "1.0.0"
          assert DEFAULT_LLM_MODEL == "gpt-4o-mini"
          assert hashlib.sha256(ORCHESTRATOR_SYSTEM_PROMPT.encode("utf-8")).hexdigest() == (
              "9255a15213b96a9ba219fd43fb402e8d797842064c73d5a9e629d73f0b3269c2"
          )
          for forbidden in (
              "OpenAI(",
              "responses.create",
              "execute_tool(",
              "retrieve_knowledge_need(",
              "retrieve_web_need(",
              "requests.",
              "httpx.",
              "duckdb.connect",
              "SELECT ",
              "INSERT ",
              "UPDATE ",
              "DELETE ",
          ):
              assert forbidden not in source, forbidden
          PY
