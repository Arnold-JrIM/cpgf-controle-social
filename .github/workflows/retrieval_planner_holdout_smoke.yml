name: retrieval-planner-holdout-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Measure Retrieval Planner 1.0.0 on frozen Holdout 1.0.0
        run: |
          python scripts/evaluate_retrieval_planner_holdout.py --output retrieval_planner_holdout_v1_0_0.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("retrieval_planner_holdout_v1_0_0.json").read_text(encoding="utf-8"))
          planner = payload["planner"]
          assert payload["holdout_version"] == "1.0.0"
          assert payload["planner_version"] == "1.0.0"
          assert payload["router_version"] == "1.1.0"
          assert payload["frozen_before_valid_measurement_commit"] == "0b8fdb36f17a370ef3d47c979798936cc46c1ce4"
          assert payload["holdout_sha256"] == "ec17f7b2c4c93ae862f0796bfd7a1380b64409fa5270c67b7f00625f1f88a667"
          assert payload["question_overlap_exact_with_development"] == 0
          assert planner["cases"] == 30
          print("RETRIEVAL PLANNER HOLDOUT 1.0.0: MEASURED")
          print(json.dumps({
              "scope_exact_match_rate": planner["scope_exact_match_rate"],
              "temporal_exact_match_rate": planner["temporal_exact_match_rate"],
              "joint_exact_match_rate": planner["joint_exact_match_rate"],
              "route_counts": planner["route_counts"],
              "error_count": payload["diagnostics"]["error_count"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload Holdout 1.0.0 evaluation
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-planner-holdout-v1.0.0-evaluation
          path: retrieval_planner_holdout_v1_0_0.json
          if-no-files-found: error
          retention-days: 14
