name: joint-retrieval-holdout-v4-first-measurement

on:
  pull_request:
    paths:
      - "scripts/measure_joint_retrieval_holdout_v4.py"
      - "scripts/preflight_joint_retrieval_holdout_v4.py"
      - "data/benchmarks/joint_retrieval_holdout_v4_0_0.csv"
      - "data/manifests/joint_retrieval_holdout_4_0_0.json"
      - "src/cpgf/benchmark/joint_retrieval_v4.py"
      - "src/cpgf/ai/router.py"
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/version.py"
      - ".github/workflows/joint_retrieval_holdout_v4_first_measurement.yml"
  workflow_dispatch:

jobs:
  measurement:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Revalidate frozen state immediately before first measurement
        run: |
          python scripts/preflight_joint_retrieval_holdout_v4.py \
            --output jh4_preflight_before_measurement.json
      - name: Execute frozen Router -> Planner first measurement
        run: |
          python scripts/measure_joint_retrieval_holdout_v4.py \
            --output joint_retrieval_holdout_v4_measurement.json
      - name: Validate evidence contract without performance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          preflight = json.loads(Path("jh4_preflight_before_measurement.json").read_text())
          p = json.loads(Path("joint_retrieval_holdout_v4_measurement.json").read_text())

          assert preflight["status"] == "PASS"
          assert preflight["manifest_status"] == "FROZEN_BEFORE_MEASUREMENT"
          assert preflight["current_flow"]["matches_frozen_flow"] is True
          assert p["status"] == "INDEPENDENT_MEASUREMENT"
          assert p["benchmark_sha256"] == "a90867717d73407b586cee02ec2eeb8c075db2f86c345bb9985193e0ca31700a"
          assert p["summary"]["cases"] == 48
          assert p["frozen_flow"]["router_version"] == "1.4.0"
          assert p["frozen_flow"]["retrieval_planner_version"] == "1.3.0"
          assert p["governance"]["performance_threshold_applied_to_workflow_success"] is False
          assert p["governance"]["low_performance_causes_workflow_failure"] is False
          assert p["governance"]["retriever_called"] is False
          assert p["governance"]["llm_called"] is False
          # Deliberadamente não há assert sobre a nota obtida.
          PY
      - name: Upload first-measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-holdout-v4-first-measurement-py${{ matrix.python-version }}
          path: |
            jh4_preflight_before_measurement.json
            joint_retrieval_holdout_v4_measurement.json
          if-no-files-found: error
