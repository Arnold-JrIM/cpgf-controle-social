name: grounded-answer-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/grounded_answer.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_grounded_answer.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/grounded_answer_1_0_0.md"
      - ".github/workflows/grounded_answer_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/grounded_answer.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_grounded_answer.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/grounded_answer_1_0_0.md"
      - ".github/workflows/grounded_answer_v1.yml"

permissions:
  contents: read

jobs:
  answer-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint grounded answer boundary
        run: ruff check src/cpgf/ai/grounded_answer.py tests/unit/test_grounded_answer.py
      - name: Validate synthesis verifier and versions
        run: pytest -q tests/unit/test_grounded_answer.py tests/unit/test_versions.py
      - name: Enforce evidence-only answer policy
        run: |
          python - <<'PY'
          from pathlib import Path

          from cpgf.ai.grounded_answer import ANSWER_PIPELINE_VERSION, ANSWER_POLICY_VERSION
          from cpgf.ai.model_policy import DEFAULT_LLM_MODEL

          source = Path("src/cpgf/ai/grounded_answer.py").read_text(encoding="utf-8")
          assert ANSWER_PIPELINE_VERSION == "1.0.0"
          assert ANSWER_POLICY_VERSION == "1.0.0"
          assert DEFAULT_LLM_MODEL == "gpt-4o-mini"
          assert "store=False" in source
          assert "supported_by_evidence" in source
          assert "requires_human_review" in source
          assert "ANSWER_BUNDLE_INCOMPLETE" in source
          assert "ANSWER_SIMULATION_REJECTED" in source
          assert "AUDIT_JUDGMENT_GUARD" in source
          assert "execute_tool" not in source
          assert "run_evidence_orchestration" not in source
          assert "requests." not in source
          assert "httpx." not in source
          assert "urlopen" not in source
          PY
