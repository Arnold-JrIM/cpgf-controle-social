name: retrieval-planner-v1.1-regression

on:
  pull_request:
    paths:
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/version.py"
      - "scripts/evaluate_retrieval_planner_v1_1_regression.py"
      - "tests/unit/test_retrieval_planner_v1_1.py"
      - "data/benchmarks/knowledge_retrieval_v1_0_0.csv"
      - "data/benchmarks/retrieval_planner_holdout_v1_0_0.csv"
      - ".github/workflows/retrieval_planner_v1_1_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Evaluate known Planner regression sets
        run: |
          python scripts/evaluate_retrieval_planner_v1_1_regression.py \
            --output retrieval_planner_v1_1_regression.json
      - name: Run Planner unit gate
        run: pytest -q tests/unit/test_retrieval_planner_v1_1.py tests/unit/test_versions.py
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-planner-v1.1.0-regression-py${{ matrix.python-version }}
          path: retrieval_planner_v1_1_regression.json
          if-no-files-found: error
      - name: Enforce known-regression gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("retrieval_planner_v1_1_regression.json").read_text(encoding="utf-8")
          )
          assert payload["status"] == "KNOWN_REGRESSION_ONLY"
          assert payload["router_version"] == "1.2.0"
          assert payload["planner_version"] == "1.1.0"
          for key in ("development", "known_holdout"):
              result = payload[key]["result"]
              assert result["cases"] == 30, (key, result)
              assert result["scope_exact_match_rate"] == 1.0, (
                  key,
                  payload[key]["joint_divergent_ids"],
              )
              assert result["temporal_exact_match_rate"] == 1.0, (
                  key,
                  payload[key]["joint_divergent_ids"],
              )
              assert result["joint_exact_match_rate"] == 1.0, (
                  key,
                  payload[key]["joint_divergent_ids"],
              )
          assert payload["governance"]["new_generalization_claim"] is False
          assert payload["governance"]["llm_called"] is False
          assert payload["governance"]["sql_executed"] is False
          PY
