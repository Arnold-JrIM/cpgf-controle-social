name: full-regression-canonical

on:
  push:
    branches:
      - test/full-regression-execution

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Show runner resources
        run: |
          free -h
          df -h .

      - name: Download canonical Kaggle snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          from cpgf.ingestion.kaggle import download_snapshot

          resolved = download_snapshot(
              Path("data/raw/full_regression"),
              path="CPGF_201301_a_202607.csv",
              force_download=True,
          )
          print(f"Kaggle resolved path: {resolved}")
          PY
          find data/raw/full_regression -type f -maxdepth 5 -printf '%p %s bytes\n'

      - name: Execute canonical T01-T09 regression gate
        run: |
          CSV="$(find data/raw/full_regression -type f -name 'CPGF_201301_a_202607.csv' | head -n 1)"
          test -n "$CSV"
          echo "Canonical candidate: $CSV"
          python scripts/run_full_regression.py \
            --input "$CSV" \
            --mode both \
            --output data/outputs/full_regression_report.json

      - name: Print regression report
        if: always()
        run: |
          if [ -f data/outputs/full_regression_report.json ]; then
            cat data/outputs/full_regression_report.json
          else
            echo "Regression report was not generated."
          fi

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-report
          path: data/outputs/full_regression_report.json
          if-no-files-found: warn
