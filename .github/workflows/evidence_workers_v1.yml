name: evidence-workers-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/evidence_workers.py"
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_evidence_workers.py"
      - "tests/unit/test_web_evidence.py"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/evidence_workers_1_0_0.md"
      - "docs/architecture/web_freshness_worker_1_0_0.md"
      - ".github/workflows/evidence_workers_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/evidence_workers.py"
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_evidence_workers.py"
      - "tests/unit/test_web_evidence.py"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/evidence_workers_1_0_0.md"
      - "docs/architecture/web_freshness_worker_1_0_0.md"
      - ".github/workflows/evidence_workers_v1.yml"

permissions:
  contents: read

jobs:
  workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint worker boundary
        run: ruff check src/cpgf/ai/evidence_workers.py src/cpgf/ai/web_evidence.py src/cpgf/ai/orchestration_graph.py tests/unit/test_evidence_workers.py tests/unit/test_web_evidence.py
      - name: Validate workers and graph
        run: pytest -q tests/unit/test_evidence_workers.py tests/unit/test_web_evidence.py tests/unit/test_orchestration_graph.py tests/unit/test_versions.py
      - name: Enforce least privilege and model policy
        run: |
          python - <<'PY'
          from pathlib import Path

          from cpgf.ai.contracts import ToolName
          from cpgf.ai.evidence_workers import DATA_EVIDENCE_TOOLS, EVIDENCE_WORKER_VERSION
          from cpgf.ai.model_policy import DEFAULT_LLM_MODEL
          from cpgf.ai.orchestration_graph import ORCHESTRATION_GRAPH_VERSION
          from cpgf.ai.web_evidence import (
              WEB_EVIDENCE_POLICY_VERSION,
              WEB_EVIDENCE_WORKER_VERSION,
          )

          data_source = Path("src/cpgf/ai/evidence_workers.py").read_text(encoding="utf-8")
          web_source = Path("src/cpgf/ai/web_evidence.py").read_text(encoding="utf-8")
          combined = data_source + "\n" + web_source
          assert EVIDENCE_WORKER_VERSION == "1.0.0"
          assert WEB_EVIDENCE_WORKER_VERSION == "1.0.0"
          assert WEB_EVIDENCE_POLICY_VERSION == "1.0.0"
          assert ORCHESTRATION_GRAPH_VERSION == "1.2.0"
          assert DEFAULT_LLM_MODEL == "gpt-4o-mini"
          assert ToolName.METHODOLOGY not in DATA_EVIDENCE_TOOLS
          assert "ChatOpenAI" not in combined
          assert "OpenAI(" not in combined
          assert "requests." not in combined
          assert "httpx." not in combined
          assert "urlopen(" not in web_source
          assert "WEB_WORKER_DISABLED_V1" in data_source
          PY
