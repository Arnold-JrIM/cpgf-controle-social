name: ruff-import-probe

on:
  push:
    branches:
      - feature/governance-core-v1.3.2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Show expected import diff
        run: ruff check src/cpgf/governance/consolidation.py --select I --fix --diff || true
