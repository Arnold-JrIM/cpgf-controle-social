name: joint-retrieval-holdout-v3-candidate-preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Reproduce historical candidate preflight without Router or Planner execution
        run: |
          python scripts/preflight_joint_retrieval_holdout_v3_candidate.py \
            --output joint_retrieval_holdout_v3_candidate_preflight.json
      - name: Upload candidate preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-holdout-v3-candidate-preflight-py${{ matrix.python-version }}
          path: joint_retrieval_holdout_v3_candidate_preflight.json
          if-no-files-found: error
