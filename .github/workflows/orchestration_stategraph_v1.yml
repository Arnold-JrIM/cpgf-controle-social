name: orchestration-stategraph-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/evidence_workers.py"
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_evidence_workers.py"
      - "tests/unit/test_web_evidence.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestration_stategraph_1_0_0.md"
      - "docs/architecture/evidence_workers_1_0_0.md"
      - "docs/architecture/web_freshness_worker_1_0_0.md"
      - ".github/workflows/orchestration_stategraph_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/evidence_workers.py"
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_evidence_workers.py"
      - "tests/unit/test_web_evidence.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestration_stategraph_1_0_0.md"
      - "docs/architecture/evidence_workers_1_0_0.md"
      - "docs/architecture/web_freshness_worker_1_0_0.md"
      - ".github/workflows/orchestration_stategraph_v1.yml"

permissions:
  contents: read

jobs:
  stategraph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint orchestration boundary
        run: ruff check src/cpgf/ai/orchestration_graph.py src/cpgf/ai/evidence_workers.py src/cpgf/ai/web_evidence.py src/cpgf/ai/model_policy.py tests/unit/test_orchestration_graph.py tests/unit/test_evidence_workers.py tests/unit/test_web_evidence.py
      - name: Validate StateGraph and versions
        run: pytest -q tests/unit/test_orchestration_graph.py tests/unit/test_evidence_workers.py tests/unit/test_web_evidence.py tests/unit/test_versions.py
      - name: Enforce no-LLM orchestration boundary and model policy
        run: |
          python - <<'PY'
          from pathlib import Path

          from cpgf.ai.model_policy import DEFAULT_LLM_MODEL, LLM_MODEL_POLICY_VERSION
          from cpgf.ai.orchestration_graph import ORCHESTRATION_GRAPH_VERSION

          graph_source = Path("src/cpgf/ai/orchestration_graph.py").read_text(encoding="utf-8")
          worker_source = Path("src/cpgf/ai/evidence_workers.py").read_text(encoding="utf-8")
          web_source = Path("src/cpgf/ai/web_evidence.py").read_text(encoding="utf-8")
          combined = graph_source + "\n" + worker_source + "\n" + web_source
          assert DEFAULT_LLM_MODEL == "gpt-4o-mini"
          assert LLM_MODEL_POLICY_VERSION == "1.0.0"
          assert ORCHESTRATION_GRAPH_VERSION == "1.2.0"
          assert "ChatOpenAI" not in combined
          assert "OpenAI(" not in combined
          assert "requests." not in combined
          assert "httpx." not in combined
          assert "urlopen(" not in web_source
          assert "SELECT " not in worker_source.upper()
          assert "INSERT " not in worker_source.upper()
          assert "UPDATE " not in worker_source.upper()
          assert "DELETE " not in worker_source.upper()
          PY
