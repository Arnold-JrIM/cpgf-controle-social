name: orchestration-stategraph-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestration_stategraph_1_0_0.md"
      - ".github/workflows/orchestration_stategraph_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/model_policy.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/orchestration_stategraph_1_0_0.md"
      - ".github/workflows/orchestration_stategraph_v1.yml"

permissions:
  contents: read

jobs:
  stategraph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint orchestration boundary
        run: ruff check src/cpgf/ai/orchestration_graph.py src/cpgf/ai/model_policy.py tests/unit/test_orchestration_graph.py
      - name: Validate StateGraph and versions
        run: pytest -q tests/unit/test_orchestration_graph.py tests/unit/test_versions.py
      - name: Enforce simulated boundary and model policy
        run: |
          python - <<'PY'
          from pathlib import Path

          from cpgf.ai.model_policy import DEFAULT_LLM_MODEL, LLM_MODEL_POLICY_VERSION
          from cpgf.ai.orchestration_graph import ORCHESTRATION_GRAPH_VERSION

          source = Path("src/cpgf/ai/orchestration_graph.py").read_text(encoding="utf-8")
          assert DEFAULT_LLM_MODEL == "gpt-4o-mini"
          assert LLM_MODEL_POLICY_VERSION == "1.0.0"
          assert ORCHESTRATION_GRAPH_VERSION == "1.0.0"
          assert "ChatOpenAI" not in source
          assert "OpenAI(" not in source
          assert "execute_tool(" not in source
          assert "PlannedKnowledgeRetriever(" not in source
          assert "duckdb" not in source.lower()
          PY
