name: router-v1.4-regression

on:
  pull_request:
    paths:
      - "src/cpgf/ai/router.py"
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/version.py"
      - "scripts/evaluate_router_v1_4_regression.py"
      - "tests/unit/test_assistant_router_v1_4.py"
      - "tests/unit/test_router_v1_4_manifest.py"
      - "tests/unit/test_versions.py"
      - "data/benchmarks/assistant_v1_0_0.csv"
      - "data/benchmarks/assistant_router_holdout_v1_0_0.csv"
      - "data/benchmarks/assistant_router_holdout_v2_0_0.csv"
      - "data/benchmarks/joint_retrieval_holdout_v2_0_0.csv"
      - "data/benchmarks/joint_retrieval_holdout_v3_0_0.csv"
      - "data/manifests/assistant_router_1_4_0.json"
      - ".github/workflows/router_v1_4_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Evaluate Router 1.4 historical compatibility
        run: python scripts/evaluate_router_v1_4_regression.py --output router_v1_4_regression.json
      - name: Run Router 1.4 unit and manifest gates
        run: |
          pytest -q \
            tests/unit/test_assistant_router_v1_4.py \
            tests/unit/test_router_v1_4_manifest.py \
            tests/unit/test_versions.py
      - name: Upload Router 1.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-v1.4-historical-regression-py${{ matrix.python-version }}
          path: router_v1_4_regression.json
          if-no-files-found: error
      - name: Enforce Router 1.4 historical contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("router_v1_4_regression.json").read_text())
          manifest = json.loads(
              Path("data/manifests/assistant_router_1_4_0.json").read_text()
          )
          assert p["status"] == "KNOWN_REGRESSION_ONLY"
          assert p["router_version"] == "1.4.0"
          assert p["router_source_git_blob_sha"] == "89150b97e9c87d9af0d0b0f888870dcc74ef86b1"
          assert p["historical_planner_version_held_fixed"] == "1.2.0"
          assert isinstance(p["current_planner_version"], str)
          assert p["current_planner_version"]

          for key, cases in {"development": 50, "router_holdout_v1": 40, "router_holdout_v2": 40}.items():
              s = p["routing_sets"][key]["summary"]
              assert s["cases"] == cases
              assert s["accuracy_all"] == 1.0, p["routing_sets"][key]["errors"]

          assert p["joint_holdout_v2_route_regression"]["route_exact"] == 40
          jh3 = p["joint_holdout_v3_route_regression"]
          assert jh3["cases"] == 48
          assert jh3["route_exact"] == 48, jh3["route_error_ids"]

          frozen = p["historical_joint_holdout_v3_with_planner_1_2"]
          assert frozen == manifest["known_regression_sets"]["joint_holdout_v3"]
          assert frozen["joint_route_scope_temporal_exact"] == 39
          assert frozen["remaining_joint_error_ids"] == [
              "JH3-003", "JH3-027", "JH3-028", "JH3-029", "JH3-030",
              "JH3-033", "JH3-034", "JH3-036", "JH3-037",
          ]

          g = p["governance"]
          assert g["historical_joint_filters_recomputed_with_current_planner"] is False
          assert g["historical_router_manifest_preserved"] is True
          assert g["current_planner_may_advance"] is True
          assert g["new_generalization_claim"] is False
          assert g["llm_called"] is False
          assert g["retriever_called"] is False
          PY
