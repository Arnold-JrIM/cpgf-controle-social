name: joint-retrieval-flow-attribution

on:
  pull_request:
    paths:
      - "data/benchmarks/joint_retrieval_holdout_v2_0_0.csv"
      - "data/manifests/joint_retrieval_holdout_2_0_0.json"
      - "data/manifests/joint_retrieval_flow_attribution_1_0_0.json"
      - "src/cpgf/ai/router.py"
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/benchmark/joint_retrieval.py"
      - "src/cpgf/benchmark/joint_retrieval_attribution.py"
      - "src/cpgf/benchmark/__init__.py"
      - "src/cpgf/version.py"
      - "scripts/diagnose_joint_retrieval_flow_attribution.py"
      - "tests/unit/test_joint_retrieval_flow_attribution.py"
      - "tests/unit/test_versions.py"
      - ".github/workflows/joint_retrieval_flow_attribution.yml"
  workflow_dispatch:

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run post-hoc counterfactual diagnosis
        run: |
          python scripts/diagnose_joint_retrieval_flow_attribution.py \
            --output joint_retrieval_flow_attribution.json
      - name: Run attribution unit tests
        run: |
          pytest -q \
            tests/unit/test_joint_retrieval_flow_attribution.py \
            tests/unit/test_versions.py
      - name: Validate governance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("joint_retrieval_flow_attribution.json").read_text(encoding="utf-8")
          )
          assert payload["status"] == "POST_HOC_DIAGNOSTIC"
          result = payload["result"]
          assert result["cases"] == 40
          assert result["actual_joint_exact"] == 12
          assert result["actual_joint_failures"] == 28
          assert sum(result["attribution_counts"].values()) == 40
          governance = result["governance"]
          assert governance["diagnostic_is_post_hoc"] is True
          assert governance["joint_holdout_2_is_already_known"] is True
          assert governance["router_rules_modified"] is False
          assert governance["planner_rules_modified"] is False
          assert governance["question_and_oracle_held_fixed"] is True
          assert governance["counterfactual_changes_only_route_decision"] is True
          assert governance["not_a_new_generalization_claim"] is True
          assert governance["llm_called"] is False
          assert governance["sql_executed"] is False
          assert governance["retriever_called"] is False
          PY
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-flow-attribution-py${{ matrix.python-version }}
          path: joint_retrieval_flow_attribution.json
          if-no-files-found: error
