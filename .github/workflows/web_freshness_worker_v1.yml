name: web-freshness-worker-v1

on:
  pull_request:
    paths:
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_web_evidence.py"
      - "tests/fixtures/web_search/official_first.json"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/web_freshness_worker_1_0_0.md"
      - ".github/workflows/web_freshness_worker_v1.yml"
  push:
    branches: [main]
    paths:
      - "src/cpgf/ai/web_evidence.py"
      - "src/cpgf/ai/orchestration_graph.py"
      - "src/cpgf/ai/__init__.py"
      - "src/cpgf/version.py"
      - "tests/unit/test_web_evidence.py"
      - "tests/fixtures/web_search/official_first.json"
      - "tests/unit/test_orchestration_graph.py"
      - "tests/unit/test_versions.py"
      - "docs/architecture/web_freshness_worker_1_0_0.md"
      - ".github/workflows/web_freshness_worker_v1.yml"

permissions:
  contents: read

jobs:
  web-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint WEB boundary
        run: ruff check src/cpgf/ai/web_evidence.py src/cpgf/ai/orchestration_graph.py tests/unit/test_web_evidence.py
      - name: Validate WEB policy and graph
        run: pytest -q tests/unit/test_web_evidence.py tests/unit/test_orchestration_graph.py tests/unit/test_versions.py
      - name: Validate frozen snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          from cpgf.ai.web_evidence import WebSearchResult

          payload = json.loads(
              Path("tests/fixtures/web_search/official_first.json").read_text(encoding="utf-8")
          )
          assert payload["fixture_version"] == "1.0.0"
          assert datetime.fromisoformat(payload["observed_at"]).tzinfo is not None
          assert payload["query"] == "CPGF atualização oficial"
          assert len(payload["results"]) == 3
          for row in payload["results"]:
              published = row["published_at"]
              WebSearchResult(
                  title=row["title"],
                  url=row["url"],
                  text=row["text"],
                  published_at=datetime.fromisoformat(published) if published else None,
              )
          PY
      - name: Enforce external-content boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          from cpgf.ai.model_policy import DEFAULT_LLM_MODEL
          from cpgf.ai.orchestration_graph import ORCHESTRATION_GRAPH_VERSION
          from cpgf.ai.web_evidence import (
              OFFICIAL_DOMAIN_SUFFIXES,
              WEB_EVIDENCE_POLICY_VERSION,
              WEB_EVIDENCE_WORKER_VERSION,
          )

          source = Path("src/cpgf/ai/web_evidence.py").read_text(encoding="utf-8")
          assert WEB_EVIDENCE_WORKER_VERSION == "1.0.0"
          assert WEB_EVIDENCE_POLICY_VERSION == "1.0.0"
          assert ORCHESTRATION_GRAPH_VERSION == "1.2.0"
          assert DEFAULT_LLM_MODEL == "gpt-4o-mini"
          assert "gov.br" in OFFICIAL_DOMAIN_SUFFIXES
          assert "leg.br" in OFFICIAL_DOMAIN_SUFFIXES
          assert "trust\": \"untrusted_external_content" in source
          assert "ChatOpenAI" not in source
          assert "OpenAI(" not in source
          assert "requests." not in source
          assert "httpx." not in source
          assert "urlopen(" not in source
          PY
