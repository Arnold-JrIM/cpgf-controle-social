name: joint-retrieval-flow-attribution-v4

on:
  pull_request:
    paths:
      - "src/cpgf/benchmark/joint_retrieval_attribution_v4.py"
      - "scripts/diagnose_joint_retrieval_flow_attribution_v4.py"
      - "data/manifests/joint_retrieval_holdout_4_0_0.json"
      - "data/manifests/joint_retrieval_flow_attribution_v4_1_0_0.json"
      - "tests/unit/test_joint_retrieval_flow_attribution_v4.py"
      - "src/cpgf/ai/router.py"
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/version.py"
      - ".github/workflows/joint_retrieval_flow_attribution_v4.yml"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run post-hoc counterfactual attribution
        run: |
          python scripts/diagnose_joint_retrieval_flow_attribution_v4.py \
            --output joint_retrieval_flow_attribution_v4.json
      - name: Enforce diagnostic governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("joint_retrieval_flow_attribution_v4.json").read_text())
          assert p["status"] == "POST_HOC_DIAGNOSTIC"
          assert p["source_independent_measurement"]["joint_holdout_version"] == "4.0.0"
          assert p["source_independent_measurement"]["joint_exact"] == 18
          assert p["source_independent_measurement"]["joint_failures"] == 30
          r = p["result"]
          assert r["cases"] == 48
          assert r["actual_joint_exact"] == 18
          assert r["actual_joint_failures"] == 30
          g = r["governance"]
          assert g["diagnostic_is_post_hoc"] is True
          assert g["joint_holdout_4_is_already_known"] is True
          assert g["router_rules_modified"] is False
          assert g["planner_rules_modified"] is False
          assert g["counterfactual_changes_only_route_decision"] is True
          assert g["not_a_new_generalization_claim"] is True
          assert g["llm_called"] is False
          assert g["retriever_called"] is False
          PY
      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-retrieval-flow-attribution-v4-py${{ matrix.python-version }}
          path: joint_retrieval_flow_attribution_v4.json
          if-no-files-found: error
