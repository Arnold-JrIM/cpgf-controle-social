name: governance-full-regression-canonical

on:
  push:
    branches:
      - test/governance-full-regression-v1.3.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Show runner resources
        run: |
          free -h
          df -h .

      - name: Download canonical Kaggle snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          from cpgf.ingestion.kaggle import download_snapshot

          resolved = download_snapshot(
              Path("data/raw/governance_regression"),
              path="CPGF_201301_a_202607.csv",
              force_download=True,
          )
          print(f"Kaggle resolved path: {resolved}")
          PY
          find data/raw/governance_regression -type f -maxdepth 5 -printf '%p %s bytes\n'

      - name: Execute Governance 1.3.2 bootstrap gate
        run: |
          CSV="$(find data/raw/governance_regression -type f -name 'CPGF_201301_a_202607.csv' | head -n 1)"
          test -n "$CSV"
          python scripts/run_governance_regression.py \
            --input "$CSV" \
            --bootstrap \
            --output data/outputs/governance_regression_report.json

      - name: Print governance regression report
        if: always()
        run: |
          if [ -f data/outputs/governance_regression_report.json ]; then
            cat data/outputs/governance_regression_report.json
          else
            echo "Governance regression report was not generated."
          fi

      - name: Upload governance regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-regression-report
          path: data/outputs/governance_regression_report.json
          if-no-files-found: warn
