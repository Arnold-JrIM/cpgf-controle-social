name: router-v1.3-regression

on:
  pull_request:
    paths:
      - "src/cpgf/ai/router.py"
      - "src/cpgf/ai/retrieval_planner.py"
      - "src/cpgf/version.py"
      - "scripts/evaluate_router_v1_3_regression.py"
      - "tests/unit/test_assistant_router_v1_3.py"
      - "tests/unit/test_router_v1_3_manifest.py"
      - "data/manifests/assistant_router_1_3_0.json"
      - ".github/workflows/router_v1_3_regression.yml"
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/evaluate_router_v1_3_regression.py --output router_v1_3_regression.json
      - run: pytest -q tests/unit/test_assistant_router_v1_3.py tests/unit/test_router_v1_3_manifest.py tests/unit/test_versions.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-v1.3-history-py${{ matrix.python-version }}
          path: router_v1_3_regression.json
          if-no-files-found: error
      - name: Enforce historical compatibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("router_v1_3_regression.json").read_text())
          assert p["status"] == "HISTORICAL_EVIDENCE_WITH_CURRENT_ROUTER_REGRESSION"
          assert p["historical_router_version"] == "1.3.0"
          assert p["historical_router_source_git_blob_sha"] == "7c82b42f4409110371dcb86e15672a328a0d54bd"
          assert p["routing_sets"]["development"]["summary"]["accuracy_all"] == 1.0
          assert p["routing_sets"]["router_holdout_v1"]["summary"]["accuracy_all"] == 1.0
          assert p["routing_sets"]["router_holdout_v2"]["summary"]["accuracy_all"] == 1.0
          assert p["joint_holdout_v2_route_regression"]["route_exact"] == 40
          assert p["historical_joint_holdout_v2_with_planner_1_1"]["joint_route_scope_temporal_exact"] == 27
          assert p["governance"]["new_generalization_claim"] is False
          PY
