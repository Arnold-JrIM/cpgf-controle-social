name: knowledge-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/knowledge-corpus-v1.1.0

permissions:
  contents: read

jobs:
  smoke-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Execute Knowledge 1.1.0 governance smoke
        run: python scripts/smoke_knowledge.py
