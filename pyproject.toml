[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpgf-controle-social"
version = "0.1.0"
description = "Controle social orientado por dados e IA para o CPGF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb", "pandas", "numpy", "pyarrow", "pyyaml", "requests", "httpx",
  "pydantic>=2", "streamlit", "folium", "streamlit-folium", "plotly",
  "kagglehub", "openai", "langchain", "langchain-openai", "langgraph"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
geo = ["geopandas", "geobr"]
excel = ["openpyxl"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
